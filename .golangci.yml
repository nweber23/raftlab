version: "2"

linters:
  default: standard
  enable:
    - revive
    - errcheck
    - gocritic
    - misspell
  exclusions:
    rules:
      # Tests may ignore Close/Write errors on throwaway files.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
